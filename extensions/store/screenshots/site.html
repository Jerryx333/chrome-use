<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pricing — Acme Cloud</title>
<!-- Stand-in webpage behind the side panel in the store screenshots. -->
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d2433; background: #fff; }
  nav { display: flex; align-items: center; gap: 18px; padding: 14px 24px; border-bottom: 1px solid #eceef2; font-size: 13px; color: #5b6475; }
  nav b { color: #1d2433; font-size: 15px; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  nav b i { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #7c5cff, #3aa0ff); display: inline-block; }
  .hero { padding: 30px 24px 10px; text-align: center; }
  .hero h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
  .hero p { margin: 0; color: #5b6475; }
  .toggle { display: inline-flex; margin-top: 14px; background: #f1f3f7; border-radius: 999px; padding: 3px; font-size: 12px; }
  .toggle span { padding: 4px 12px; border-radius: 999px; }
  .toggle .on { background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 600; }
  .plans { display: grid; gap: 12px; padding: 18px 24px; }
  .plan { border: 1px solid #e3e6ec; border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .plan.pop { border-color: #7c5cff; box-shadow: 0 6px 18px rgb(124 92 255 / .14); }
  .plan h2 { margin: 0; font-size: 16px; }
  .plan .price { font-size: 20px; font-weight: 700; text-align: right; }
  .plan .price small { font-size: 12px; color: #5b6475; font-weight: 400; }
  .plan p { margin: 0; color: #5b6475; font-size: 12.5px; }
  .plan .cta { grid-column: 1 / -1; margin-top: 10px; text-align: center; padding: 7px; border-radius: 8px; font-weight: 600; font-size: 13px; background: #f1f3f7; }
  .plan.pop .cta { background: #7c5cff; color: #fff; }
  .badge { font-size: 10.5px; font-weight: 700; color: #7c5cff; background: #efebff; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
</style></head>
<body>
  <nav><b><i></i>Acme Cloud</b><span>Product</span><span>Docs</span><span>Pricing</span></nav>
  <section class="hero"><h1>Simple, predictable pricing</h1><p>Start free. Upgrade when your team grows.</p>
    <div class="toggle"><span>Monthly</span><span class="on">Yearly · save 20%</span></div></section>
  <section class="plans">
    <div class="plan"><h2>Starter</h2><div class="price">$0</div><p>5 GB storage · 1 seat</p><div class="cta">Get started</div></div>
    <div class="plan pop"><h2>Pro<span class="badge">Popular</span></h2><div class="price">$12<small>/mo</small></div><p>100 GB storage · 5 seats</p><div class="cta">Start trial</div></div>
    <div class="plan"><h2>Team</h2><div class="price">$30<small>/mo</small></div><p>1 TB storage · SSO · audit logs</p><div class="cta">Contact sales</div></div>
  </section>
</body></html>
