<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Store promo tiles. size=small is 440x280; size=marquee is 1400x560 and
     shows the side panel passed in ?panel=. -->
<style>
  html, body { margin: 0; overflow: clip; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; color: #fff;
    background: radial-gradient(120% 120% at 0% 0%, #2f6fe0 0%, #1a4fb8 45%, #12357d 100%); position: relative; }
  body::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 60% at 100% 100%, rgb(138 180 248 / .35), transparent 70%); }
  .small { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box; }
  .small .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .small .brand img { width: 52px; height: 52px; }
  .small p { font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; margin: 18px 0 0; max-width: 360px; }
  .small .tags { display: flex; gap: 8px; margin-top: 18px; }
  .small .tags span { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgb(255 255 255 / .16); }
  .marquee { width: 1400px; height: 560px; display: flex; align-items: center; padding: 0 80px; box-sizing: border-box; gap: 70px; }
  .marquee .copy { flex: 1; }
  .marquee .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 650; }
  .marquee .brand img { width: 44px; height: 44px; }
  .marquee h1 { font-size: 54px; line-height: 1.08; letter-spacing: -.025em; margin: 24px 0 16px; }
  .marquee p { font-size: 21px; line-height: 1.45; opacity: .9; margin: 0; max-width: 560px; }
  .marquee .shot { width: 400px; height: 620px; align-self: flex-start; margin-top: 60px; border-radius: 14px 14px 0 0;
    box-shadow: 0 30px 80px rgb(0 0 0 / .35); background: #fff; position: relative; z-index: 1; overflow: clip; }
  .marquee iframe { border: 0; width: 100%; height: 100%; display: block; }
</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search)
  const icon = '../../ab-connect/icons/icon128.png'
  if (q.get('size') === 'marquee') {
    document.body.innerHTML = `<div class="marquee"><div class="copy"><div class="brand"><img src="${icon}" alt="">chrome-use</div>
      <h1>Your local AI agent,<br>in the Chrome you're logged into</h1>
      <p>Codex, Claude Code, OpenCode or Pi works on real pages from a side panel. Everything runs on your own computer.</p></div>
      <div class="shot"><iframe src="${q.get('panel')}"></iframe></div></div>`
  } else {
    document.body.innerHTML = `<div class="small"><div class="brand"><img src="${icon}" alt="">chrome-use</div>
      <p>Your local AI agent, in the Chrome you're logged into</p>
      <div class="tags"><span>Codex</span><span>Claude Code</span><span>OpenCode</span><span>Pi</span></div></div>`
  }
</script>
</body></html>
