name: Position indicator isolated research
on:
  push:
    branches: [research/position-indicator-ci]
permissions:
  contents: read
jobs:
  pixels-and-input:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISPLAY: ':99'
      CHROME_USE_ISOLATED_GUI_HOST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare isolated headed display
        run: |
          if ! command -v Xvfb || ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y xvfb ffmpeg
          fi
          echo "CHROME_BINARY=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
          Xvfb :99 -screen 0 1280x900x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 1
      - name: Probe actual browser and desktop pixels
        run: node docs/evidence/position-indicator-20261026/probe.mjs "$RUNNER_TEMP/position-evidence"
      - name: Verify page and independent desktop captures
        if: always()
        run: |
          node docs/evidence/position-indicator-20261026/pixels.mjs "$RUNNER_TEMP/position-evidence"
          node docs/evidence/position-indicator-20261026/pixels.mjs "$RUNNER_TEMP/position-evidence" desktop
          node --input-type=module - "$RUNNER_TEMP/position-evidence" <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root=process.argv[2];
          const evidence=JSON.parse(readFileSync(root+'/evidence.json','utf8'));
          assert.ok(Object.values(evidence.checks).every(Boolean));
          for(const name of ['pixels.json','pixels-desktop.json']){
            const data=JSON.parse(readFileSync(root+'/'+name,'utf8'));
            assert.ok(data.visible.magentaPixels>0,name);
            assert.ok(data['detach-before'].magentaPixels>0,name);
            for(const label of ['baseline','hidden','navigation','navigation-hidden','detached'])assert.equal(data[label].magentaPixels,0,name+':'+label);
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: position-indicator-independent-pixels
          path: ${{ runner.temp }}/position-evidence
