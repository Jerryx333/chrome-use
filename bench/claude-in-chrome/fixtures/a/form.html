<!doctype html><html><head><meta charset="utf-8"><title>Signup test form</title></head><body>
<h1>Conference signup</h1>
<form id="f" onsubmit="event.preventDefault();const d=Object.fromEntries(new FormData(this));d.topics=new FormData(this).getAll('topics');document.getElementById('result').textContent='SUBMITTED '+JSON.stringify(d);">
<label>Full name <input name="name" required></label><br>
<label>Email <input name="email" type="email" required></label><br>
<label>Country <select name="country"><option value="">--</option><option>Japan</option><option>Germany</option><option>Brazil</option></select></label><br>
<fieldset><legend>Ticket</legend><label><input type="radio" name="ticket" value="student">Student</label><label><input type="radio" name="ticket" value="regular">Regular</label><label><input type="radio" name="ticket" value="vip">VIP</label></fieldset>
<fieldset><legend>Topics</legend><label><input type="checkbox" name="topics" value="ai">AI</label><label><input type="checkbox" name="topics" value="web">Web</label><label><input type="checkbox" name="topics" value="security">Security</label></fieldset>
<label>Arrival date <input type="date" name="arrival"></label><br>
<label>Notes <textarea name="notes"></textarea></label><br>
<label><input type="checkbox" name="terms" value="yes" required> I accept the terms</label><br>
<button type="submit">Register</button>
</form><pre id="result"></pre></body></html>
