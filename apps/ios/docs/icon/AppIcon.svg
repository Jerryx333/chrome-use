<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- chrome-use Remote app icon: the extension's robot on its yellow field,
       with a phone badge. Full bleed; iOS applies the corner mask.
       Rendered to App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D1DC"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A44"/>
      <stop offset="1" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7ECF2"/>
      <stop offset="1" stop-color="#9AA6B6"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFE9A6"/>
      <stop offset="1" stop-color="#E0A21B"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3757"/>
      <stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#8A5A00" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- antenna -->
    <rect x="502" y="190" width="20" height="96" rx="10" fill="#B7C1CE"/>
    <circle cx="512" cy="178" r="34" fill="url(#gold)"/>
    <!-- ears -->
    <rect x="192" y="430" width="74" height="170" rx="37" fill="url(#ear)"/>
    <rect x="758" y="430" width="74" height="170" rx="37" fill="url(#ear)"/>
    <!-- head -->
    <rect x="236" y="276" width="552" height="474" rx="150" fill="url(#head)"/>
    <!-- visor -->
    <rect x="300" y="350" width="424" height="300" rx="112" fill="url(#visor)"/>
  </g>
  <!-- face -->
  <g fill="none" stroke="#5CE1FF" stroke-width="30" stroke-linecap="round" filter="url(#glow)">
    <path d="M392 478 q38 -46 76 0"/>
    <path d="M556 478 q38 -46 76 0"/>
    <path d="M462 560 q50 40 100 0"/>
  </g>
  <!-- visor shine -->
  <path d="M340 392 q40 -30 120 -30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- phone badge -->
  <g filter="url(#shadow)">
    <rect x="690" y="640" width="190" height="300" rx="44" fill="url(#phone)" stroke="#FFFFFF" stroke-width="14"/>
    <rect x="752" y="664" width="66" height="14" rx="7" fill="#0A0F1C"/>
  </g>
  <g fill="none" stroke="#5CE1FF" stroke-width="20" stroke-linecap="round" filter="url(#glow)">
    <path d="M745 800 q40 -40 80 0"/>
    <path d="M718 772 q67 -66 134 0"/>
  </g>
  <circle cx="785" cy="836" r="16" fill="#5CE1FF" filter="url(#glow)"/>
</svg>
